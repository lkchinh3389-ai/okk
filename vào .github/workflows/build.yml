name: Build ESP Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tu giai nen file zip neu chua co settings.gradle
      - name: Extract zip (neu can)
        run: |
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)" ]; then
            z=$(ls ff-overlay-controller-fixed.zip 2>/dev/null || ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$z" ]; then
              echo "::error::Khong thay file zip hoac settings.gradle trong repo"; ls -la; exit 1
            fi
            echo "Giai nen $z"
            mkdir -p _src
            unzip -q -o "$z" -d _src
          fi

      - name: Locate Android project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::Khong thay settings.gradle"; find . -not -path './.git/*' | head -50; exit 1
          fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ff-overlay-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
